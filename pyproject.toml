[project]
name = "realitybridge"
version = "0.0.1"
description = "Reference-backed executable simulator generation and repair for a bounded business API."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jason Lovell" }]
license = { file = "LICENSE" }
keywords = ["agent-environments", "differential-testing", "simulator-fidelity", "counterexample-repair"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.10",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "jsonschema>=4.23,<5",
]

[project.urls]
Repository = "https://github.com/jlov7/realitybridge"
Issues = "https://github.com/jlov7/realitybridge/issues"
Security = "https://github.com/jlov7/realitybridge/blob/main/SECURITY.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=7.0",
    "pyright>=1.1.414",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reality_bridge"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# The six-operation contract and pinned reference adapter define this bounded
# comparison; no separate Gitea client library is required.

[tool.pyright]
include = ["src", "tests", "experiments", "reference"]
typeCheckingMode = "basic"

[tool.coverage.run]
source = ["src/reality_bridge"]

[tool.coverage.report]
# Offline baseline (59%): the live-container integration tests add the
# reference.py path on top, bringing the full-suite total to ~70%.
fail_under = 55
show_missing = true
